<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Silow — Harbor Mutual (sample data · fictional)</title>
<link rel="icon" href="./silow-mark.svg" type="image/svg+xml">
<style>
@font-face{ font-family:"Inter"; src:url("./inter.woff2") format("woff2"); font-weight:100 900; font-display:swap; }
:root{
  --font:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --desk: radial-gradient(1200px 600px at 80% -10%, #eef2ff 0%, rgba(238,242,255,0) 60%), radial-gradient(900px 640px at -10% 110%, #cbd6f6 0%, rgba(203,214,246,0) 60%), linear-gradient(160deg,#c4d1f4 0%,#aebfee 50%,#bfcbf2 100%);
  --frame: linear-gradient(180deg,#eff1f8 0%,#e8ebf5 100%);
  --sheet:#fdfdfc; --sheet-2:#f5f5f7; --sheet-3:#ededf1;
  --line:rgba(20,20,30,.08); --line-2:rgba(20,20,30,.13); --line-3:rgba(20,20,30,.055);
  --t1:#18181d; --t2:#4b4b55; --t3:#6f6f7a; --t4:#a9a9b2;
  --hover:rgba(20,20,30,.045); --sel:rgba(20,20,30,.075);
  --ink:#2f4a9e; --ink-2:#5a72c2; --ink-3:#8fa2dc; --ink-4:#c3cfef; --soft:#edf1fc;
  --hum:#d6dae4;
  --solid:#18181d;
  --fr-t1:rgba(18,18,32,.86); --fr-t2:rgba(18,18,32,.58); --fr-t3:rgba(18,18,32,.42);
  --fr-hover:rgba(255,255,255,.40); --fr-sel:rgba(255,255,255,.82); --fr-field:rgba(255,255,255,.5); --fr-line:rgba(18,18,32,.08);
  --green:#2f9461; --green-soft:#e4f3ea; --amber:#b87a0c; --amber-soft:#fbf5e6; --amber-line:rgba(184,122,12,.22); --amber-ink:#82560a; --red:#c8463d; --red-soft:#fbecea;
  --sh-win:0 30px 70px rgba(20,35,90,.24), 0 0 0 1px rgba(255,255,255,.4);
  --sh-sheet:0 0 0 1px rgba(20,20,40,.05), 0 1px 2px rgba(20,20,40,.05), 0 8px 24px -8px rgba(20,20,40,.10);
  --sh-pill:0 0 0 .5px rgba(20,20,40,.07), 0 1px 2px rgba(20,20,40,.09);
  --sh-card:0 0 0 1px rgba(20,20,40,.07), 0 1px 2px rgba(20,20,40,.04);
  --sh-float:0 0 0 1px rgba(20,20,40,.06), 0 24px 48px -12px rgba(20,20,40,.22), 0 4px 12px rgba(20,20,40,.06);
  --glass:rgba(253,253,252,.9);
  --calm:linear(0,.006,.025 2.8%,.101 6.1%,.539 18.9%,.721 25.3%,.849 31.5%,.937 38.1%,.968 41.8%,.991 45.7%,1.006 50.1%,1.015 55%,1.017 63.9%,1.001 85.9%,1);
  --out:cubic-bezier(.2,.8,.2,1);
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font-family:var(--font); font-size:13.5px; line-height:1.45; color:var(--t1); background:var(--desk); -webkit-font-smoothing:antialiased; font-feature-settings:"cv11","ss03"; overflow:hidden; }
button,input{ font:inherit; color:inherit; }
button{ background:none; border:0; padding:0; cursor:pointer; }
.num,.tn{ font-variant-numeric:tabular-nums; }
svg.i{ flex:none; display:block; }

/* ---------- window ---------- */
.stage{ height:100dvh; padding:14px 16px 16px; display:flex; flex-direction:column; }
body.embed .stage{ padding:0; }
body.embed .win{ border-radius:0; box-shadow:none; }
.win{ flex:1; min-height:0; display:flex; flex-direction:column; border-radius:14px; overflow:hidden; box-shadow:var(--sh-win); background:var(--frame); }
.topbar{ height:44px; flex:none; display:flex; align-items:center; padding:0 12px 0 16px; gap:10px; }
.lights{ display:flex; gap:8px; margin-right:4px; }
.lights i{ width:12px; height:12px; border-radius:50%; background:#ff5f57; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12); }
.lights i:nth-child(2){ background:#febc2e; } .lights i:nth-child(3){ background:#28c840; }
.tb-mid{ flex:1; display:flex; justify-content:center; min-width:0; }
.addr{ height:28px; min-width:300px; border-radius:8px; background:var(--fr-field); display:flex; align-items:center; justify-content:center; gap:7px; font-size:12.5px; color:var(--fr-t2); padding:0 14px; white-space:nowrap; }
.addr svg{ color:var(--green); }
.tb-r{ display:flex; gap:6px; align-items:center; }
.chip-s{ height:24px; border-radius:999px; padding:0 10px; display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--t2); background:rgba(255,255,255,.6); white-space:nowrap; }
.chip-s i{ width:6px; height:6px; border-radius:50%; background:var(--green); }
.chip-s.sample{ background:rgba(255,255,255,.92); color:var(--t1); font-weight:500; }
.wbody{ flex:1; min-height:0; display:flex; padding:0 8px 8px 0; }

/* ---------- sidebar on the frame ---------- */
.side{ width:236px; flex:none; display:flex; flex-direction:column; padding:2px 8px 8px 10px; min-height:0; }
.brand{ display:flex; align-items:center; gap:9px; height:40px; padding:0 6px; }
.brand img{ width:26px; height:26px; border-radius:7px; background:#fff; box-shadow:var(--sh-card); padding:3px; }
.brand b{ font-size:15px; font-weight:600; letter-spacing:-.01em; }
.brand small{ margin-left:auto; font-size:12px; color:var(--fr-t2); }
.side-scroll{ flex:1; min-height:0; overflow:auto; scrollbar-width:none; padding-top:6px; }
.nav{ height:32px; display:flex; align-items:center; gap:10px; padding:0 9px; border-radius:8px; font-size:13.5px; color:var(--fr-t1); width:100%; text-align:left; transition:background .12s; }
.nav svg{ color:var(--fr-t2); }
.nav:hover{ background:var(--fr-hover); }
.nav.on{ background:var(--fr-sel); box-shadow:var(--sh-pill); font-weight:500; }
.nav.on svg{ color:var(--t1); }
.nav .cnt{ margin-left:auto; font-size:12px; color:var(--fr-t2); font-weight:400; font-variant-numeric:tabular-nums; }
.sh{ font-size:12px; font-weight:600; color:var(--fr-t2); padding:16px 9px 6px; }
.sw{ width:10px; height:10px; border-radius:3px; flex:none; background:linear-gradient(135deg,#cdd8f6,var(--ink)); }
.nav.sub{ height:30px; font-size:13px; }
.side-foot{ flex:none; display:flex; align-items:center; gap:9px; padding:10px 6px 2px; border-top:1px solid var(--fr-line); }
.side-foot .who{ font-size:13px; line-height:1.25; } .side-foot .who small{ display:block; font-size:11.5px; color:var(--fr-t2); }

/* avatars: pastel monograms (named) or a neutral mark (anonymous) */
.av{ width:26px; height:26px; border-radius:50%; display:inline-grid; place-items:center; font-size:10.5px; font-weight:600; flex:none; letter-spacing:.01em; }
.av.lg{ width:44px; height:44px; font-size:15px; }
.av.anon{ background:#eceef3 !important; color:#6f7280 !important; box-shadow:inset 0 0 0 1px rgba(20,20,40,.08); font-weight:500; }

/* ---------- sheet ---------- */
.sheet{ flex:1; min-width:0; min-height:0; background:var(--sheet); border-radius:10px; box-shadow:var(--sh-sheet); display:flex; flex-direction:column; position:relative; overflow:hidden; }
.shead{ height:52px; flex:none; display:flex; align-items:center; gap:10px; padding:0 14px 0 20px; border-bottom:1px solid var(--line-3); }
.crumb{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--t3); white-space:nowrap; min-width:0; overflow:hidden; }
.crumb b{ color:var(--t1); font-weight:600; overflow:hidden; text-overflow:ellipsis; }
.shead .sp{ flex:1; }
.seg{ display:inline-flex; background:var(--sheet-2); border-radius:9px; padding:2px; gap:2px; max-width:100%; overflow-x:auto; scrollbar-width:none; flex:none; }
.seg button{ height:26px; padding:0 11px; border-radius:7px; font-size:12.5px; color:var(--t2); white-space:nowrap; flex:none; }
.seg button:hover{ color:var(--t1); }
.seg button.on{ background:var(--sheet); color:var(--t1); font-weight:500; box-shadow:var(--sh-card); }
.anon-t{ display:inline-flex; align-items:center; gap:8px; height:30px; padding:0 10px 0 8px; border-radius:8px; box-shadow:0 0 0 1px var(--line-2); font-size:12.5px; color:var(--t2); white-space:nowrap; background:var(--sheet); }
.anon-t:hover{ background:var(--sheet-2); }
.anon-t .tg{ width:28px; height:16px; border-radius:999px; background:#c9ccd6; position:relative; transition:background .2s; flex:none; }
.anon-t .tg::after{ content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:transform .25s var(--calm); }
.anon-t.on .tg{ background:var(--solid); }
.anon-t.on .tg::after{ transform:translateX(12px); }
.anon-t b{ font-weight:500; color:var(--t1); }
.sbody{ flex:1; min-height:0; overflow:auto; scroll-behavior:smooth; }
.page{ max-width:1120px; margin:0 auto; padding:26px 40px 72px; }
.view{ display:none; }
.view.on{ display:block; animation:vin .32s var(--calm); }
@keyframes vin{ from{ opacity:0; transform:translateY(6px); } }

/* ---------- type ---------- */
h1{ font-size:27px; line-height:33px; font-weight:650; letter-spacing:-.022em; margin:0; }
h2{ font-size:18px; line-height:24px; font-weight:600; letter-spacing:-.012em; margin:0; }
h3{ font-size:14.5px; font-weight:600; letter-spacing:-.008em; margin:0; }
.lede{ margin-top:8px; color:var(--t2); font-size:14.5px; line-height:22px; max-width:780px; }
.lede b{ color:var(--t1); font-weight:600; }
.meta{ font-size:12.5px; color:var(--t3); }
.sec{ margin-top:34px; }
.sec-h{ display:flex; align-items:baseline; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.sec-h .k{ font-size:12px; color:var(--t3); font-variant-numeric:tabular-nums; }
.sec-h p{ flex-basis:100%; margin:2px 0 0; color:var(--t3); font-size:13px; }
.sec-h .r{ margin-left:auto; }
.ink{ color:var(--ink); }
.muted{ color:var(--t3); }
.note{ font-size:12.5px; color:var(--t3); margin-top:10px; }
.pill{ display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:6px; font-size:11.5px; font-weight:500; background:var(--sheet-2); color:var(--t2); white-space:nowrap; }
.pill.ink{ background:var(--soft); color:var(--ink); }
.pill.green{ background:var(--green-soft); color:var(--green); }
.pill.amber{ background:var(--amber-soft); color:var(--amber-ink); }
.pill.red{ background:var(--red-soft); color:var(--red); }
.banner{ display:flex; gap:10px; align-items:center; padding:10px 14px; border-radius:10px; background:var(--sheet-2); color:var(--t2); font-size:13px; margin-top:16px; }
.banner svg{ color:var(--t3); }

/* hairline tile strip */
.tiles{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:1px; background:var(--line); border-radius:12px; overflow:hidden; box-shadow:0 0 0 1px var(--line); margin-top:20px; }
.tiles.c4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
.tiles.c6{ grid-template-columns:repeat(6,minmax(0,1fr)); }
.tiles.c3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.tile{ background:var(--sheet); padding:14px 16px 13px; display:flex; flex-direction:column; gap:4px; min-width:0; }
.tile .l{ font-size:12px; color:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile b{ font-size:23px; font-weight:600; letter-spacing:-.025em; line-height:1.15; font-variant-numeric:tabular-nums; white-space:nowrap; }
.tile b small{ font-size:13px; font-weight:500; color:var(--t3); letter-spacing:-.01em; margin-left:3px; }
.tile .s{ font-size:12px; color:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile.hl b{ color:var(--ink); }
.tile.hl b small{ color:var(--ink); opacity:.7; }
.up{ color:var(--amber-ink); } .down{ color:var(--green); }

.card{ border-radius:12px; background:var(--sheet); box-shadow:var(--sh-card); padding:16px 18px; min-width:0; }
.card.flat{ box-shadow:none; background:var(--sheet-2); }
.g2{ display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:14px; }
.g2e{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; }
.g3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.card h3 + .meta{ margin-top:2px; }

/* bars */
.bars{ display:flex; flex-direction:column; gap:11px; margin-top:12px; }
.bar{ display:grid; grid-template-columns:minmax(120px,206px) 1fr 74px; gap:12px; align-items:center; font-size:13px; }
.bar .n{ min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar .n small{ display:block; font-size:11.5px; color:var(--t3); overflow:hidden; text-overflow:ellipsis; }
.track{ height:10px; border-radius:6px; background:var(--sheet-2); overflow:hidden; display:flex; }
.track i{ display:block; height:100%; background:var(--hum); }
.track i.ai{ background:var(--ink); }
.track i.l2{ background:var(--ink-3); }
.bar .v{ text-align:right; color:var(--t2); font-variant-numeric:tabular-nums; white-space:nowrap; }
.bar .v small{ color:var(--t3); margin-left:4px; }
.legend{ display:flex; gap:14px; font-size:12px; color:var(--t3); margin-top:12px; flex-wrap:wrap; }
.legend i{ display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align:-1px; background:var(--hum); }
.legend i.ai{ background:var(--ink); }

/* rows / lists */
.rows{ border-top:1px solid var(--line); }
.row{ display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line); min-width:0; }
.row .grow{ flex:1; min-width:0; }
.row .t{ font-weight:500; }
.row .d{ font-size:12.5px; color:var(--t3); margin-top:1px; }
.row .v{ font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--t2); text-align:right; }
.row .v b{ color:var(--t1); font-weight:600; }
.row.click{ cursor:pointer; border-radius:8px; }
.row.click:hover{ background:var(--hover); }
.rk{ width:22px; height:22px; border-radius:6px; background:var(--sheet-2); display:grid; place-items:center; font-size:11.5px; font-weight:600; color:var(--t2); flex:none; font-variant-numeric:tabular-nums; }
.chev{ color:var(--t4); }

/* expandable category rows */
.cat{ border-bottom:1px solid var(--line); }
.cat > button{ width:100%; display:grid; grid-template-columns:minmax(0,1fr) 180px 92px 18px; gap:14px; align-items:center; padding:12px 2px; text-align:left; }
.cat > button:hover{ background:var(--hover); border-radius:8px; }
.cat .t{ font-weight:500; }
.cat .d{ font-size:12.5px; color:var(--t3); }
.cat .v{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.cat .v small{ display:block; font-size:11.5px; color:var(--t3); }
.cat .chev{ transition:transform .2s; }
.cat.open .chev{ transform:rotate(90deg); }
.cat .tasks{ display:none; padding:0 0 12px 0; }
.cat.open .tasks{ display:block; }
.task{ display:grid; grid-template-columns:minmax(0,1fr) 120px 64px; gap:12px; padding:7px 10px; font-size:13px; border-radius:6px; }
.task:nth-child(odd){ background:var(--sheet-2); }
.task .a{ color:var(--t3); font-size:12.5px; }
.task .m{ text-align:right; font-variant-numeric:tabular-nums; color:var(--t2); }

/* week timeline */
.tl{ margin-top:12px; }
.tl-row{ display:grid; grid-template-columns:44px 1fr 58px; gap:10px; align-items:center; height:30px; }
.tl-row .dl{ font-size:12.5px; color:var(--t2); font-weight:500; }
.tl-row .dv{ font-size:12px; color:var(--t3); text-align:right; font-variant-numeric:tabular-nums; }
.tl-track{ position:relative; height:18px; border-radius:5px; background:repeating-linear-gradient(90deg, var(--sheet-2) 0 calc(100%/13 - 1px), var(--line-3) calc(100%/13 - 1px) calc(100%/13)); }
.tl-track .off{ position:absolute; top:0; bottom:0; background:rgba(184,122,12,.06); }
.tl-track i{ position:absolute; top:2px; bottom:2px; border-radius:3px; }
.tl-axis{ display:grid; grid-template-columns:44px 1fr 58px; gap:10px; margin-top:4px; }
.tl-axis div{ position:relative; height:14px; font-size:11px; color:var(--t3); font-variant-numeric:tabular-nums; }
.tl-axis div span{ position:absolute; transform:translateX(-50%); white-space:nowrap; }
.c0, .legend i.c0{ background:var(--ink) } .c1, .legend i.c1{ background:var(--ink-2) } .c2, .legend i.c2{ background:var(--ink-3) } .c3, .legend i.c3{ background:var(--ink-4) } .c4, .legend i.c4{ background:#a7adbb } .c5, .legend i.c5{ background:#d3d6de }

/* people workload */
.wl{ display:grid; grid-template-columns:minmax(150px,220px) 1fr 70px 70px 64px 16px; gap:12px; align-items:center; padding:9px 4px; border-bottom:1px solid var(--line); font-size:13px; cursor:pointer; border-radius:6px; }
.wl:hover{ background:var(--hover); }
.wl.h{ cursor:default; font-size:12px; color:var(--t3); padding-top:4px; }
.wl.h:hover{ background:none; }
.wl .who{ display:flex; align-items:center; gap:9px; min-width:0; }
.wl .who span{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wl .who small{ display:block; color:var(--t3); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; }
.wl .v{ text-align:right; font-variant-numeric:tabular-nums; color:var(--t2); white-space:nowrap; }
.stack{ height:12px; border-radius:4px; overflow:hidden; display:flex; background:var(--sheet-2); }
.stack i{ display:block; height:100%; }

/* trend columns */
.trend{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
.tc{ border-radius:12px; box-shadow:var(--sh-card); padding:14px 16px; }
.tc .l{ font-size:12px; color:var(--t3); }
.tc .cols{ display:flex; align-items:flex-end; gap:8px; height:72px; margin-top:10px; }
.tc .col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px; height:100%; }
.tc .col i{ display:block; width:100%; max-width:34px; border-radius:4px 4px 2px 2px; background:var(--hum); }
.tc .col.on i{ background:var(--ink); }
.tc .col small{ font-size:11px; color:var(--t3); white-space:nowrap; }
.tc .now{ margin-top:8px; display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; color:var(--t3); }
.tc .now b{ font-size:18px; color:var(--t1); font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }

/* heat table */
.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
.tbl th{ text-align:right; font-weight:500; font-size:12px; color:var(--t3); padding:8px 10px; border-bottom:1px solid var(--line-2); white-space:nowrap; }
.tbl th:first-child, .tbl td:first-child{ text-align:left; padding-left:2px; }
.tbl td{ text-align:right; padding:10px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; white-space:nowrap; }
.tbl tr.click{ cursor:pointer; } .tbl tr.click:hover td{ background:var(--hover); }
.tbl td.heat{ position:relative; padding:5px 4px; }
.tbl.heatt td:first-child{ padding-right:6px; } .tbl.heatt th{ padding:6px 4px; text-align:center; } .tbl.heatt td.heat{ text-align:center; }
.tbl td .hb{ display:inline-block; min-width:44px; padding:3px 6px; border-radius:5px; }
.scrollx{ overflow-x:auto; scrollbar-width:thin; }

/* picker */
.picker{ position:relative; display:inline-block; }
.pick-btn{ display:inline-flex; align-items:center; gap:10px; height:40px; padding:0 12px 0 8px; border-radius:10px; box-shadow:0 0 0 1px var(--line-2); background:var(--sheet); max-width:100%; }
.pick-btn:hover{ background:var(--sheet-2); }
.pick-btn .tx{ text-align:left; line-height:1.2; min-width:0; }
.pick-btn .tx b{ display:block; font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pick-btn .tx small{ display:block; font-size:12px; color:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pop{ position:absolute; top:46px; left:0; width:340px; max-height:420px; display:none; flex-direction:column; background:var(--glass); backdrop-filter:blur(24px) saturate(1.5); -webkit-backdrop-filter:blur(24px) saturate(1.5); border-radius:14px; box-shadow:var(--sh-float); z-index:30; overflow:hidden; }
.pop.on{ display:flex; animation:pin .24s var(--calm); }
@keyframes pin{ from{ opacity:0; transform:translateY(-6px) scale(.985); } }
.pop input{ margin:10px; height:34px; border-radius:9px; border:0; outline:0; box-shadow:inset 0 0 0 1px var(--line-2); padding:0 12px; background:#fff; font-size:13px; }
.pop .lst{ overflow:auto; padding:0 6px 8px; }
.pop .grp{ font-size:11.5px; font-weight:600; color:var(--t3); padding:8px 8px 4px; }
.pop .it{ display:flex; align-items:center; gap:9px; width:100%; padding:6px 8px; border-radius:8px; text-align:left; }

function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function R(key){ let a=hash(key); return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function lr(weights,total){ const s=weights.reduce((a,b)=>a+b,0)||1; const raw=weights.map(w=>w/s*total); const fl=raw.map(Math.floor);

const AI_WEEK=[.86,1,1.12];

const _pw={};
function personWeek(pid,wi){
  const k=pid+'|'+wi; if(_pw[k]) return _pw[k];
  const p=PERSON[pid], role=ROLES[p.role], team=TEAM[p.team], r=R(k);
  const total=Math.round(p.base*10*team.wf[wi]*(0.965+r()*0.07));
  const w=role.cats.map(c=>c.sh*(team.boost[wi][c.type]||1)*(0.9+R(k+c.id)()*0.2));
  const dh=lr(w,total);
  const apps={};
  const cats=role.cats.map((c,i)=>{
    const min=dh[i]*6;
    const an=Object.keys(c.apps), ad=lr(an.map(a=>c.apps[a]),dh[i]); an.forEach((a,j)=>apps[a]=(apps[a]||0)+ad[j]);
    const td=lr(c.tasks.map(t=>t[2]),dh[i]);
    return { id:c.id, n:c.n, type:c.type, ai:c.ai, dh:dh[i], min, eps:Math.max(1,Math.round(min/c.avg)), aiDh:dh[i]*c.ai,

  });

  const frag=Math.min(.6,role.frag*(0.9+R(pid+'fr')()*0.2)*Math.pow(team.wf[wi],2));

}
function timeline(p,wi,cats,total){
  const r=R(p.id+'tl'+wi);
  const dayDh=lr([1.03,1,1.05,1.01,.93].map(x=>x*(0.92+r()*0.16)),total);
  let blocks=[];
  cats.forEach(c=>{ let left=c.min; while(left>0){ let sz=(3+Math.floor(r()*12))*6; if(left-sz<18) sz=left; blocks.push({cat:c.id,min:sz}); left-=sz; } });
  for(let i=blocks.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [blocks[i],blocks[j]]=[blocks[j],blocks[i]]; }
  const days=[]; let after=0, longest=0;
  const late = TEAM[p.team].wf[wi]>1.06 ? 1 : 0;
  dayDh.forEach((ddh,d)=>{
    let need=ddh*6; const list=[];
    while(need>0 && blocks.length){ const b=blocks.shift(); if(b.min<=need){ list.push(b); need-=b.min; } else { list.push({cat:b.cat,min:need}); blocks.unshift({cat:b.cat,min:b.min-need}); need=0; } }
    let t=Math.round(p.st*60 + (r()*30-12) - (late? 20:0)); let worked=0, lunch=false; const out=[];
    list.forEach(b=>{
      const last=out[out.length-1];
      if(last && last.cat===b.cat && last.e===t){ last.e+=b.min; } else out.push({cat:b.cat,s:t,e:t+b.min});
      t+=b.min; worked+=b.min;
      if(!lunch && worked>=230){ t+=30+Math.floor(r()*4)*6; lunch=true; } else t+=Math.floor(r()*3)*6;
    });
    // evening log-ins: on heavy weeks people come back after dinner
    const evening = late ? r()<0.55 : r()<0.12;
    if(evening && out.length>2){ const lb=out[out.length-1]; const mv=Math.min(lb.e-lb.s-6, (5+Math.floor(r()*6))*6);
      if(mv>=24){ lb.e-=mv; const s=19*60+6*Math.floor(r()*5); out.push({cat:lb.cat,s,e:s+mv}); } }
    out.forEach(b=>{ after+=Math.max(0,450-b.s)-Math.max(0,450-b.e)+Math.max(0,b.e-1080)-Math.max(0,b.s-1080); longest=Math.max(longest,b.e-b.s); });
    days.push({d:DAYS[d],min:ddh*6,blocks:out,start:out.length?out[0].s:0,end:out.length?out[out.length-1].e:0});
  });
  return { days, afterMin:after, longest };
}
function teamWeek(tid,wi){
  const t=TEAM[tid]; const ppl=t.members.map(p=>personWeek(p.id,wi));
  const cats={}, apps={}, types={};
  ppl.forEach(pw=>{ pw.cats.forEach(c=>{ const x=cats[c.id]||(cats[c.id]={id:c.id,n:c.n,type:c.type,dh:0,aiDh:0,eps:0,people:0,tasks:{}});
      x.dh+=c.dh; x.aiDh+=c.aiDh; x.eps+=c.eps; if(c.dh>0) x.people++; c.tasks.forEach(tk=>{ x.tasks[tk.t]=(x.tasks[tk.t]||0)+tk.min; });
      types[c.type]=(types[c.type]||0)+c.dh; });
    Object.entries(pw.apps).forEach(([a,v])=>apps[a]=(apps[a]||0)+v); });

    eps:ppl.reduce((a,x)=>a+x.eps,0), aiDh:ppl.reduce((a,x)=>a+x.aiDh,0), sw:wavg(x=>x.sw), frag:wavg(x=>x.frag),

}

function evidence(sid){

/* ---------- Ask Silow: prepared answer bank with fuzzy intent matching (no LLM in this demo) ---------- */
const STOP = new Set('the a an of to in on for and or is are was were be do does did what whats which who whom how much many our we us you your i me my it its this that these those with at by from as about can could would should will there their they them any some me please tell show give'.split(' '));
function norm(s){ return ' '+s.toLowerCase().replace(/[’']/g,'').replace(/&/g,' and ').replace(/[^a-z0-9%$\- ]+/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim()+' '; }
function toks(s){ return norm(s).trim().split(' ').filter(Boolean); }
function dl(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; const d=[]; for(let i=0;i<=m;i++){ d[i]=[i]; } for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){ const c=a[i-1]===b[j-1]?0:1; d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c); if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1); } return d[m][n]; }
function tokMatch(q,k){ if(q===k) return true; if(k.length>=4 && q.length>=4 && (q.startsWith(k)||k.startsWith(q)) && Math.min(q.length,k.length)>=4) return true;
  if(k.length>=4 && q.length>=4){ const d=dl(q,k); return k.length<=6 ? d<=1 : d<=2; } return false; }
function has(qt, qn, phrase){ // phrase match: exact substring, or every word fuzzily present
  const pn=norm(phrase); if(qn.includes(pn)) return 1;
  const pw=pn.trim().split(' ').filter(w=>!STOP.has(w)); if(!pw.length) return 0;
  return pw.every(w=>qt.some(t=>tokMatch(t,w))) ? (pw.length>1?.9:.8) : 0;
}
/* entities */
const TEAM_AL = { strat:['strategic operations','strategic ops','strategy ops','strategy team','strategic'], fin:['finance operations','finance','financial','accounting','reinsurance','payables','fpa','fp and a','accounts payable'],
  intake:['claims intake','intake','fnol team','first notice team','intake team'], qa:['claims testing','testing team','qa team','qa','testers','test team','quality assurance'], uw:['underwriting support','underwriting','policy service','underwriters'] };
const DIR_AL = { intake:['claims intake','fnol','intake'], report:['reporting','reconciliation','report','reports','pack'], test:['testing','test','qa','regression'], policy:['policy servicing','policy','endorsement','endorsements','submissions'], fin:['finance','financial','payments','bordereaux','invoices'] };
const PROC_AL = { p1:['fnol','first notice','claim set up','claim setup','new claim'], p2:['loss ratio pack','monthly pack','ops pack','loss ratio'], p3:['regression','release testing','test cycle'], p4:['endorsement','policy change'], p5:['medical bill','bill to payment','bills','workers comp bill'] };
const SUG_AL = { fnol:['fnol','first notice'], docs:['attachment','attachments','indexing','document matching'], medbill:['medical bill','fee schedule','bill pre check'], pack:['ops pack','loss ratio pack','monthly pack'], dailyrep:['daily intake report','daily report'], status:['status digest','initiative tracker','program status'], regress:['regression'], testdata:['test data'], defects:['defect','defects'], endorse:['endorsement','endorsements'], subm:['submission','submissions'], coi:['certificate','certificates','coi'], recon:['bank reconciliation','payment reconciliation'], bdx:['bordereaux'], invoice:['invoice','invoices'] };
const APPS = ['ClaimCenter','Policy admin','Excel','Outlook','Teams','SharePoint','Power BI','Jira','Test manager','Document portal','Bill review portal','General ledger','PowerPoint','Word','SQL client','VS Code','Browser'];
const NAME_AMBIG = new Set(['price','grant','dev','park','hill','martin','cole','sam','tom','grace','kim','chen']);
function entities(q){
  const qn=norm(q), qt=toks(q), e={};
  for(const [id,al] of Object.entries(TEAM_AL)) for(const a of al){ const an=norm(a); if(qn.includes(an) || (an.trim().length>=6 && an.trim().split(' ').length===1 && qt.some(t=>tokMatch(t,an.trim())))){ e.team=e.team||id; break; } }
  for(const [id,al] of Object.entries(DIR_AL)) for(const a of al){ if(qn.includes(norm(a))){ e.dir=e.dir||id; break; } }
  for(const [id,al] of Object.entries(PROC_AL)) for(const a of al){ if(qn.includes(norm(a))){ e.proc=e.proc||id; break; } }
  for(const [id,al] of Object.entries(SUG_AL)) for(const a of al){ if(qn.includes(norm(a))){ e.sug=e.sug||id; break; } }
  for(const a of APPS){ const an=norm(a).trim(); if(qn.includes(' '+an+' ') || (an.length>=6 && qt.some(t=>tokMatch(t,an.replace(/ /g,''))))){ e.app=e.app||a; } }
  for(const p of PEOPLE){
    const codeHit = qt.includes(p.code.toLowerCase());
    const [f,l]=p.n.toLowerCase().split(' ');
    const full = norm(p.n); const okf=!NAME_AMBIG.has(f), okl=!NAME_AMBIG.has(l);
    const nameHit = qn.includes(full) || qt.some(t=>(okf&&(t===f||(t.length>=6&&f.length>=6&&dl(t,f)<=1)))||(okl&&(t===l||(t.length>=6&&l.length>=6&&dl(t,l)<=1))));
    if(codeHit){ e.person=p.id; e.byCode=true; break; }
    if(nameHit){ e.person=p.id; e.byName=true; break; }
  }
  return e;
}

   return {h:`<p><b>${p.n}</b> — ${p.d}</p><ol>${p.steps.map(x=>`<li>${x.s} · <span class="muted">${x.who}, ${x.app}, ${hm(x.min)}${x.wait?`, waits ${x.wait} h before`:''}</span> — <b>${x.ai==='agent'?'agent can take':x.ai==='assist'?'AI assists':'stays human'}</b></li>`).join('')}</ol><p>${hm(s.hands)} hands-on and ${s.wait} h of waiting per run; an agent can take ${hm(s.agentMin)} of the hands-on time.</p>`, s:[chipPr(p.id)]}; } },

   return {h:`<p>${t?`<b>${TEAM[t].name}</b>`:'Company'} over three weeks:</p>${mtbl(['Week','Hours','AI could take','After hours'],all.map((x,i)=>[WEEKS[i].label,Hn(x.dh),Hn(x.aiDh),hm(x.afterMin)]))}<p>${t==='fin'?'Week 3 is month-end: reconciliation and pack work rise about a third.':t==='intake'?'Week 2 is a storm-related FNOL spike.':t==='qa'?'Week 3 is a release week.':'Hours grow each week: a storm in week 2 (Claims intake), a release and month-end in week 3.'}</p>`, s:[t?chipT(t):chipC()]}; } },
 {id:'agents', kw:[['agent',2],['agents',2.2],['what would you build',2.8],['build',1.4],['bot',1.6],['bots',1.6],['what gets built',2.8],['automate it',1.6]], fn:()=>{ const top=PLAN.map(s=>({s,b:evidence(s.id).back})).sort((a,b)=>b.b-a.b).slice(0,3);
   return {h:`<p>Silow builds agents from the recorded procedure — first in shadow mode, then live once the owner approves. The first three:</p><ul>${top.map(x=>`<li><b>${x.s.t}</b> — ${x.s.build.join(' → ')}. <span class="muted">Approver: ${x.s.approver}.</span></li>`).join('')}</ul><p>Agents run inside your perimeter, and a named person approves every consequential step.</p>`, s:[chipPlan()]}; } },
 {id:'human', kw:[['stays human',3],['human in the loop',3],['approve',2],['approval',2],['approvals',2],['who decides',2.6],['oversight',2.4],['control',1.2],['replace people',2.6],['replace jobs',2.6],['jobs',1.6],['layoffs',2.6]], fn:()=>({h:`<p>Agents draft, match and prepare. <b>People decide</b>: a named owner approves every consequential step — submitting a claim, coverage judgement, payment approval, posting entries, release go/no-go.</p><p>The aim is to take the re-keying and assembly off people’s plates, not to replace the judgement your teams are paid for. Every agent run is in the audit log.</p>`, s:[chipPlan()]}) },
 {id:'deploy', kw:[['install',2.6],['installed',2.6],['installation',2.6],['deploy',2.6],['deployment',2.6],['on prem',2.8],['onprem',2.8],['docker',2.6],['compose',2],['self host',2.6],['self hosted',2.6],['infrastructure',2],['servers',1.8],['set up',1.4],['kubernetes',2.4],['our team install',2.6]], fn:()=>({h:`<p>Two ways to run it:</p><ul><li><b>Silow-hosted</b> — fastest start: install the recorder and go, no infrastructure work on your side. Raw captures are deleted within 48 hours; only derived patterns are kept. Silow is your data processor under a DPA.</li><li><b>On your servers</b> — everything inside your perimeter: one <b>Docker Compose</b> package, an install README, an <b>acceptance script</b> that checks every stage (health, capture upload, redaction, screen → steps, steps → tasks, weekly reports), <b>SSO / SAML</b> and audit logs.</li></ul><p>The recorder is the same in both: macOS, Windows or Linux, about a minute to install, 1–2% CPU, no connectors.</p>`, s:[chipDoc('Deployment guide')]}) },
 {id:'perimeter', kw:[['leave',2.4],['leaves',2.4],['leaving',2.4],['perimeter',2.8],['outside our',2],['cloud',1.6],['sent to',1.8],['send',1],['upload',1.4],['third party',2],['external',1.6],['silow see',2.6],['silow access',2.6],['you see our data',2.6],['our network',2],['data go',2.4],['where does the data',2.6],['screenshots',1.6],['video',1.4]], fn:()=>({h:`<p>It depends on how you deploy:</p><ul><li><b>On your servers</b> — capture, storage, redaction and processing run inside your perimeter. <b>Screenshots and video never reach Silow.</b> Models run on your GPUs, in your own cloud account, or on a zero-data-retention provider you choose.</li><li><b>Silow-hosted</b> — captures are processed on Silow’s servers, raw captures are deleted within 48 hours and only derived patterns are kept. Subprocessors: a major cloud provider (ISO 27001 / 27017 / 27018) and model inference with zero data retention.</li></ul><p>For PHI, use your own servers.</p>`, s:[chipDoc('Security overview')]}) },
 {id:'hipaa', kw:[['hipaa',3],['phi',3],['pii',3],['medical',1.6],['health',1.4],['redact',2.6],['redaction',2.6],['redacted',2.6],['mask',2.4],['masked',2.4],['masking',2.4],['sensitive',2],['personal data',2.4],['claimant data',2.4],['privacy',2.2],['compliance',1.8]], fn:()=>({h:`<p>PII and PHI are <b>masked by Silow’s own model before any analysis</b>. The raw screenshot is deleted once redaction is done; what remains is the shape of the work — app, step, time — with names, dates of birth and diagnoses replaced by typed tokens.</p><ul><li>Encrypted in transit and at rest</li><li>No keystrokes, no message content, no individual scoring</li><li>For PHI: on your own servers, on your models</li></ul><p>Silow is already in production in a HIPAA-regulated environment: a US insurance-claims operation handling medical documents daily, 100% on-prem. Contract terms such as a BAA are for your legal team and ours to confirm.</p>`, s:[chipDoc('Security overview')]}) },
 {id:'models', kw:[['model',1.6],['models',1.8],['llm',2.6],['gpu',2.6],['gpus',2.6],['openai',2.6],['anthropic',2.6],['gemini',2.6],['provider',2],['inference',2.4],['zero data retention',3],['zdr',3],['which ai',2.4],['own model',2.4]], fn:()=>({h:`<p>On your servers, you choose where models run:</p>${mtbl(['Option','What leaves'],[['Your own GPUs (on-prem)','Nothing leaves the building'],['GPUs in your own cloud account','Nothing leaves your tenant'],['Zero-data-retention provider on your account','Redacted data, processed and not retained']])}<p>Redaction always runs before anything is analyzed. In the Silow-hosted mode, model inference runs under zero data retention and never trains on your data.</p>`, s:[chipDoc('Architecture')]}) },
 {id:'retention', kw:[['encrypt',2.6],['encryption',2.6],['encrypted',2.6],['retention',2.6],['retain',2.4],['delete',2.2],['deleted',2.2],['deletion',2.4],['how long',1.8],['storage',1.8],['stored',1.8],['keep data',2.4],['backups',2]], fn:()=>({h:`<ul><li>Data is <b>encrypted in transit and at rest</b>.</li><li>On your servers: the <b>raw screenshot is deleted once redaction is done</b>, and retention follows your policies.</li><li>Silow-hosted: raw captures are <b>deleted within 48 hours</b>; only derived patterns are kept.</li></ul><p class="muted">Default retention periods for steps and reports are part of the security review — we’ll confirm them in writing for your environment.</p>`, s:[chipDoc('Security overview')]}) },
 {id:'monitoring', kw:[['keystroke',3],['keystrokes',3],['keylogger',3],['spy',2.6],['spying',2.6],['surveillance',2.8],['monitor employees',2.8],['monitoring',2],['scoring',2.4],['score',1.8],['productivity score',2.8],['rank people',2.6],['ranking',2],['big brother',3],['private messages',2.6],['read emails',2.4],['employees feel',2.2],['union',2]], fn:()=>({h:`<p>Silow is about <b>the work, not the worker</b>:</p><ul><li>No keystroke logging, no private message content</li><li><b>No individual scoring</b> or productivity ranking</li><li>Personal reports are written for the person themself</li><li>Anonymous mode replaces names with stable pseudonyms everywhere — try the toggle at the top</li></ul>`, s:[chipDoc('Privacy principles')]}) },

 {id:'pilot', kw:[['pilot',2.8],['trial',2.4],['one month',2.6],['first month',2.4],['next step',2.6],['next steps',2.6],['get started',2.6],['how do we start',2.8],['timeline',1.8],['how long',1.4],['proof of concept',2.8],['poc',2.6]], fn:()=>({h:`<p>Start with <b>one month</b> — you choose the team and how many people.</p><ol><li><b>Week 1</b> — recorder installed, recording, first personal reports</li><li><b>Week 2</b> — the team map and the ranked plan</li><li><b>Weeks 3–4</b> — first agents scoped and approved by you</li></ol>`, s:[chipDoc('Pilot plan')]}) },

function classify(q){
  const e=entities(q); e.q=q; const qn=norm(q), qt=toks(q).filter(t=>!STOP.has(t));
  let best=null, bs=0;
  for(const it of INTENTS){
    if(it.need && !e[it.need]) continue;
    let sc=0; for(const [ph,w] of it.kw){ const m=has(qt,qn,ph); if(m) sc+=w*m; }
    if(it.need && sc>0) sc+=1.2;
    if(it.id==='company_time' && (e.team||e.person)) sc-=1;
    if(it.id==='roi' && (e.dir||e.sug)) sc+=.4;
    if(it.id==='process' && e.proc) sc+=.8;
    if(it.id==='apps' && e.app) sc+=1;
    if(sc>bs){ bs=sc; best=it; }
  }
  if(bs<1.4){ if(e.person) best=INTENTS.find(i=>i.id==='person_time'); else if(e.team) best=INTENTS.find(i=>i.id==='team_overview'); else if(e.proc) best=INTENTS.find(i=>i.id==='process'); else if(e.app) best=INTENTS.find(i=>i.id==='apps'); else best=null; }
  return { intent: best ? best.id : 'fallback', e, score:+bs.toFixed(2) };
}
function answer(m){
  const { intent, e } = m;
  if(e.person && e.byName && S.anon && ['person_time','person_recs','person_knows'].includes(intent))
    return {h:`<p><b>Anonymous mode is on</b>, so I won’t look people up by name or map a name to a pseudonym. Ask about a role or code — for example “what does ${PEOPLE[12].pseudo} work on?” — or switch to Named if your admins allow it.</p>`, s:[chipDoc('Privacy principles')]};
  if(intent==='fallback') return {h:`<p>I don’t have a prepared answer for that in this sample. In production I answer any question from <b>your own recorded work</b>, on your own models.</p><p>Here I can tell you where time goes, what to automate first and what it’s worth, who knows what, where work waits, AI adoption, process steps, and how deployment and privacy work.</p>`, s:[chipDoc('Sample demo')]};
  const it=INTENTS.find(i=>i.id===intent); return it.fn(e, e.q);
}
const SUGGEST = ['Where does Claims intake’s time go?','What should we automate first?','What is the ROI for claims testing?','Who knows the reinsurance bordereaux?','Where does work wait the longest?','Does anything leave our network?','How do you handle PHI?','How is it installed?'];
function rAsk(){
  const hero = S.msgs.length ? '' : `<div class="ask-hero"><img src="./silow-mark.svg" alt=""><h1>Ask about Harbor Mutual’s work</h1><p>Answers come from recorded work — people, teams, processes and the plan.</p><div class="sugs">${SUGGEST.map(s=>`<button data-ask="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`;
  const msgs = S.msgs.map((m,i)=>{ const a = m.pending ? null : answer(m);
    return `<div class="mq">${esc(m.q)}</div><div class="ma" data-intent="${m.intent}"><span class="lg"><img src="./silow-mark.svg" alt=""></span><div>${a?a.h+`<div class="src">${a.s.join('')}${chipDoc('On-prem · your models')}</div>`:'<span class="typing"><i></i><i></i><i></i></span>'}</div></div>`; }).join('');
  $('#v-ask').innerHTML = `<div class="chat"><div class="chat-col">${hero}<div class="msgs" id="msgs">${msgs}</div>${S.msgs.length?`<div class="sugs" style="justify-content:flex-start;margin-top:20px">${SUGGEST.filter(s=>!S.msgs.some(m=>m.q===s)).slice(0,4).map(s=>`<button data-ask="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:''}</div>
    <div class="composer-wrap"><form class="composer" id="cform"><input id="cq" placeholder="Ask anything about the work — any wording" autocomplete="off" aria-label="Ask Silow"><button class="send" aria-label="Send">${ic('up',16,2.2)}</button></form>
    <div class="composer-f">${ic('lock',12,2)}Sample demo · prepared answers · in production Silow answers from your own data on your own models</div></div></div>`;

  // Retain recommendation details; remove controls to deleted plan/map screens.
  document.querySelectorAll('[data-v="plan"],[data-proc]').forEach(el=>{
    if(el.tagName==='BUTTON') el.remove();
    else el.replaceWith(document.createTextNode(el.textContent));
  });
  $('#cform').onsubmit = ev=>{ ev.preventDefault(); ask($('#cq').value); };
  $$('[data-ask]').forEach(b=>b.onclick=()=>ask(b.dataset.ask));
  const sb=$('#sbody'); sb.style.scrollBehavior='auto'; sb.scrollTop=sb.scrollHeight; sb.style.scrollBehavior='';
}
function ask(q){ q=(q||'').trim(); if(!q) return; const c=classify(q); const m={q, ...c, pending:true}; S.msgs.push(m); window.__lastIntent=c; rAsk();
  setTimeout(()=>{ m.pending=false; if(S.view==='ask') rAsk(); setTimeout(()=>{ const i=$('#cq'); if(i && !matchMedia('(max-width:900px)').matches) i.focus(); },0); }, 520); }

fromHash(); render();
